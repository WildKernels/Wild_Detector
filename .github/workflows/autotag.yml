name: Auto-tag + release

# Every push to main: claim the next free vN tag, build the release APK with
# versionCode/versionName pinned to that tag number, publish the release.
# A failed build deletes the claimed tag so no version number is burned.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: SDK components (pinned NDK + cmake + platform 35)
        run: |
          set -e
          SM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "ndk;28.0.13004108" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" \
            >/dev/null 2>&1 || echo "sdkmanager partial - AGP will auto-download what is missing"

      - name: Claim next vN tag
        id: tag
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bump() {
            latest=$(git tag --list 'v*' --sort=-v:refname \
                     | grep -E '^v[0-9]+$' | head -1 || true)
            if [ -z "$latest" ]; then
              echo v1
            else
              echo "v$(( ${latest#v} + 1 ))"
            fi
          }
          TAG=$(bump)
          echo "next tag: $TAG"
          for attempt in 1 2 3 4 5; do
            git tag -a "$TAG" -m "Build $TAG"
            if git push origin "refs/tags/$TAG" 2>/dev/null; then
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v${TAG#v} was claimed by a concurrent run; retrying"
            git tag -d "$TAG" >/dev/null
            git fetch --tags origin
            TAG=$(bump)
          done
          echo "::error::could not claim a tag number after 5 attempts"
          exit 1

      - name: Build release APK (versionCode = tag number)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x gradlew
          N="${TAG#v}"
          ./gradlew assembleRelease "-PwildVerCode=$N" "-PwildVerName=$N" \
            || { echo "build failed - releasing the claimed tag"; git push origin ":refs/tags/$TAG"; exit 1; }

      - name: Release the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "WildDetector-$TAG.apk"
          gh release create "$TAG" "WildDetector-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --notes "Wild Detector - reveny Native Detector base (unchanged UI) with the libwild susfs4ksu-lkm engine. versionCode matches this tag."
