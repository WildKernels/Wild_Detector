name: Auto-tag + release

# On every push to main (or a manual dispatch): build APK + adb binary,
# claim the next free vN tag, publish a GitHub release with both assets.
# Build runs BEFORE tagging so a broken build burns no version number.
# Tag pushes do not re-trigger this workflow (branch filter).
#
# The ubuntu-latest runner image ships the Android SDK with cmdline-tools
# preinstalled at /usr/local/lib/android/sdk (ANDROID_HOME) — no setup
# action needed (android-actions/setup-android@v3 is broken: it installs
# the removed 'tools' package).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install platform + build-tools + NDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12296806" \
            >/dev/null 2>install.log || { tail -50 install.log; exit 1; }
          echo "SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/* | head -1)" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        env:
          KEY_B64: ${{ secrets.LKMDET_KEYSTORE }}
        run: |
          if [ -n "$KEY_B64" ]; then
            printf '%s' "$KEY_B64" | base64 -d > lkmdet.keystore
            echo "keystore restored from repo secret"
          else
            echo "WARNING: LKMDET_KEYSTORE secret not set - generating a fresh key (signature will differ per run)"
          fi

      - name: Build LKMDet.apk + lkmdet binary
        run: |
          chmod +x build-apk.sh build.sh
          ./build-apk.sh
          ./build.sh

      - name: Tag next vN
        id: tag
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bump() {
            latest=$(git tag --list 'v*' --sort=-v:refname \
                     | grep -E '^v[0-9]+$' | head -1 || true)
            if [ -z "$latest" ]; then
              echo v1
            else
              echo "v$(( ${latest#v} + 1 ))"
            fi
          }
          TAG=$(bump)
          echo "next tag: $TAG"
          for attempt in 1 2 3 4 5; do
            git tag -a "$TAG" -m "Build $TAG"
            if git push origin "refs/tags/$TAG" 2>/dev/null; then
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v${TAG#v} was claimed by a concurrent run; retrying"
            git tag -d "$TAG" >/dev/null
            git fetch --tags origin
            TAG=$(bump)
          done
          echo "::error::could not claim a tag number after 5 attempts"
          exit 1

      - name: Release with APK + binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cp LKMDet.apk "LKMDet-$TAG.apk"
          cp lkmdet "lkmdet-$TAG"
          gh release create "$TAG" "LKMDet-$TAG.apk" "lkmdet-$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --notes "Non-root susfs LKM detector.

          - \`LKMDet-$TAG.apk\` - zero-permission app (same engine, all probes)
          - \`lkmdet-$TAG\` - arm64 adb-shell binary (push to /data/local/tmp)"
